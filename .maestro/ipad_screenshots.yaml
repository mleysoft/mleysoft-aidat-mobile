appId: ${APP_ID}
---
# Freshly-created iPad Simulator has no old app data, so clearState/clearKeychain
# would only trigger an unnecessary iOS reinstall in Maestro.
- launchApp
- extendedWaitUntil:
    visible: "Yönetici Girişi"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-login-ipad

# Public demo resident account. The API preflight checks that OTP is bypassed.
- tapOn:
    text: "Daire Girişi"
- extendedWaitUntil:
    visible: "Cep Telefonu"
    timeout: 10000
- tapOn:
    text: "Cep Telefonu"
- inputText: ${DEMO_PHONE}
- hideKeyboard
- tapOn:
    text: "WhatsApp Kodunu Gönder"
- extendedWaitUntil:
    visible: "Finansal Durum"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 02-anasayfa-ipad

- tapOn:
    text: "Aidatlar"
- extendedWaitUntil:
    visible: "Aidatlarım"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-aidatlar-ipad

- tapOn:
    text: "Ödemeler"
- extendedWaitUntil:
    visible: "Ödemelerim"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-odemeler-ipad

- tapOn:
    text: "Duyurular"
- extendedWaitUntil:
    visible: "Duyurular"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-duyurular-ipad

- tapOn:
    text: "Talepler"
- extendedWaitUntil:
    visible: "Taleplerim"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-talepler-ipad
