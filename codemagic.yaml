workflows:
  ios-testflight:
    name: MleySoft Aidat - iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.mleysoft.aidat"
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketlerini hazırla
        script: |
          flutter --version
          # v71: Bu proje CocoaPods ile yayinlaniyor. Flutter 3.47 otomatik SwiftPM migrasyonunu
          # denemesin; mevcut Runner scheme bu migrasyona ihtiyaç duymuyor.
          flutter config --no-enable-swift-package-manager
          echo "Codemagic FLUTTER_ROOT: $FLUTTER_ROOT"
          # Windows gelistirme ortamindan kalmis iOS yollarini CI'a tasima.
          rm -f ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh
          flutter clean
          flutter pub get
          test -f ios/Flutter/Generated.xcconfig
          grep '^FLUTTER_ROOT=' ios/Flutter/Generated.xcconfig
          if grep -Eq 'FLUTTER_ROOT=.*[A-Za-z]:\\' ios/Flutter/Generated.xcconfig; then
            echo "HATA: Generated.xcconfig Windows Flutter yolu iceriyor."
            exit 1
          fi

      - name: iOS proje kontrolleri
        script: |
          test -f ios/Runner/GoogleService-Info.plist
          test -f ios/Runner/PrivacyInfo.xcprivacy
          test -f ios/Runner/Runner.entitlements
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy

      - name: CocoaPods bağımlılıklarını kur
        script: |
          echo "Codemagic FLUTTER_ROOT: $FLUTTER_ROOT"
          GENERATED_FLUTTER_ROOT="$(sed -n 's/^FLUTTER_ROOT=//p' ios/Flutter/Generated.xcconfig | head -n 1)"
          echo "Generated.xcconfig FLUTTER_ROOT: $GENERATED_FLUTTER_ROOT"
          test -n "$GENERATED_FLUTTER_ROOT"
          test -f "$GENERATED_FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"
          export FLUTTER_ROOT="$GENERATED_FLUTTER_ROOT"
          cd ios
          pod install --repo-update

      - name: App Store imzalama dosyalarını hazırla
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Xcode Runner yapılandırmasını doğrula
        script: |
          set -euo pipefail
          test -d ios/Runner.xcworkspace
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings > /tmp/runner_build_settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.mleysoft.aidat" /tmp/runner_build_settings.txt
          grep -q "PRODUCT_NAME = Runner" /tmp/runner_build_settings.txt
          echo "Runner Xcode build settings OK"

      - name: TestFlight IPA oluştur
        script: |
          BUILD_NUMBER=$((72 + PROJECT_BUILD_NUMBER))
          echo "MleySoft Aidat build: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
