name: mleysoft_aidat
version: 1.0.0+146
publish_to: none
description: MleySoft Aidat Takip native Flutter uygulaması.
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  mleysoft_native_bridge:
    path: packages/mleysoft_native_bridge
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  connectivity_plus: ^6.1.5
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/aidat_icon.png
    - assets/images/brand_lockup.png
